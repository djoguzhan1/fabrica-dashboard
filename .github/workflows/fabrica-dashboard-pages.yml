# Serves web-dev-portfolio/ at https://djoguzhan1.github.io/fabrica-dashboard/
# (Preview URL until web-dev-portfolio repo is updated; canonical links in HTML still point to web-dev-portfolio.)
#
# Enable once: repo Settings → Pages → Build and deployment → GitHub Actions.

name: Deploy portfolio to fabrica-dashboard Pages

on:
  push:
    branches: [master, gh-pages]
    paths:
      - 'web-dev-portfolio/**'
      - 'character-rig-demo/**'
      - '.github/workflows/fabrica-dashboard-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name == 'gh-pages' && 'gh-pages' || 'master' }}

      - name: Select site root
        id: site
        run: |
          if [ -f web-dev-portfolio/index.html ]; then
            cp -a web-dev-portfolio public
          elif [ -f index.html ] && [ -d demos ]; then
            mkdir public && cp -a index.html styles.css img fonts demos public/
          else
            echo "::error::No portfolio files found in checkout."
            exit 1
          fi

      - name: Build character rig demo (static)
        if: hashFiles('character-rig-demo/package.json') != ''
        run: |
          cd character-rig-demo
          npm ci
          GITHUB_PAGES=1 npm run build
          mkdir -p ../public/demos/character-rig
          cp -r dist/* ../public/demos/character-rig/

      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - id: deployment
        uses: actions/deploy-pages@v4
