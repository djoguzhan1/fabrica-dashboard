[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "docbrief"
version = "0.1.0"
description = "Structured briefs of PDFs, text files and web pages, with page-referenced facts."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Oğuzhan Salatan" }]
requires-python = ">=3.10"
dependencies = [
  "pypdf>=4.0",
  "httpx>=0.27",
  "selectolax>=0.3",
]
keywords = ["summarization", "pdf", "llm", "openai", "anthropic", "cli"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Topic :: Text Processing",
]

[project.optional-dependencies]
openai = ["openai>=1.30"]
anthropic = ["anthropic>=0.30"]
dev = ["pytest>=8", "ruff>=0.5"]

[project.scripts]
docbrief = "docbrief.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
